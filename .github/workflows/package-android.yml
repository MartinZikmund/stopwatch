name: Build Android Packages

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_android:
    runs-on: ubuntu-latest

    env:
      # Adjust these to your repo layout
      Solution_Fullname: src/Stopwatch.slnx
      Android_Project: src/Stopwatch/Stopwatch.csproj
      STEP_TIMEOUT_MINUTES: 60

      # .NET niceties
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      ContinuousIntegrationBuild: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cache NuGet to speed up restores
      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln*', '**/*.csproj', '**/Directory.Packages.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install Dependencies
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        uses: "./.github/steps/install_dependencies"

      - name: Restore solution
        run: dotnet restore "$Solution_Fullname"

      # --- Signing setup (requires your keystore + secrets) ---
      # Create upload keystore file from a base64 secret
      - name: Decode Android upload keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-upload.keystore

      # --- Build Google Play bundle (AAB) ---
      - name: Publish AAB (signed with Upload Key)
        run: |
          dotnet publish "$Android_Project" -c Release -f net9.0-android \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore=android-upload.keystore \
            -p:AndroidSigningKeyAlias='${{ secrets.ANDROID_KEY_ALIAS }}' \
            -p:AndroidSigningKeyPass='${{ secrets.ANDROID_KEY_PASSWORD }}' \
            -p:AndroidSigningStorePass='${{ secrets.ANDROID_STORE_PASSWORD }}' \
            -p:AndroidPackageFormat=aab -p:PackageFormat=aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android_AAB
          path: |
            **/bin/Release/net9.0-android/publish/*.aab
            **/bin/Release/net9.0-android/*/*.aab

      # --- Optional: also build a signed APK for sideload/internal testing ---
      - name: (Optional) Publish APK (signed) - ARM64
        if: ${{ always() }} # flip to "false" to disable or delete this step
        run: |
          dotnet publish "$Android_Project" -c Release -f net9.0-android -r android-arm64 \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore=android-upload.keystore \
            -p:AndroidSigningKeyAlias='${{ secrets.ANDROID_KEY_ALIAS }}' \
            -p:AndroidSigningKeyPass='${{ secrets.ANDROID_KEY_PASSWORD }}' \
            -p:AndroidSigningStorePass='${{ secrets.ANDROID_STORE_PASSWORD }}' \
            -p:AndroidPackageFormat=apk -p:PackageFormat=apk \
            --self-contained false

      - name: Upload APK artifact (optional)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Android_APK_arm64
          path: |
            **/bin/Release/net9.0-android/android-arm64/publish/*.apk
            **/bin/Release/net9.0-android/android-arm64/*/*.apk

      # Clean up keystore
      - name: Remove keystore
        if: ${{ always() }}
        run: rm -f android-upload.keystore