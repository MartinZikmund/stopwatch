name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - release/**

permissions:
  contents: read
  actions: write

env:
  # App Configuration
  APP_NAME: Stopwatch
  DOTNET_VERSION: 10.0.x
  SOLUTION_FILE: Stopwatch.slnx
  PROJECT_PATH: src/Stopwatch
  PROJECT_FILE: src/Stopwatch/Stopwatch.csproj

  STEP_TIMEOUT_MINUTES: 60

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke_test:
    name: Smoke Test (Debug Build)
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cache NuGet to speed up restores
      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln*', '**/*.csproj', '**/Directory.Packages.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-          

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET_VERSION }}

      - name: Set version title
        uses: ./.github/steps/set_version_title
        with:
          token: ${{ github.token }}

      - name: Install .NET workloads
        run: |
          dotnet workload restore "$env:SOLUTION_FILE"
          dotnet workload install wasm-tools

      # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.3.1

      - name: Inject RevenueCat API keys
        shell: pwsh
        run: |
          $file = "$env:PROJECT_PATH/appsettings.json"
          $content = Get-Content $file -Raw
          $content = $content -replace 'REVENUECAT_IOS_API_KEY', '${{ secrets.REVENUECAT_IOS_API_KEY }}'
          $content = $content -replace 'REVENUECAT_ANDROID_API_KEY', '${{ secrets.REVENUECAT_ANDROID_API_KEY }}'
          Set-Content $file $content

      - name: Build ${{ env.APP_NAME }} (Debug)
        shell: pwsh
        run: msbuild $env:PROJECT_FILE /r
